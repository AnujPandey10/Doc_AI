<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — AI Document Assistant</title>
    <meta name="description" content="Secure login for the Air-Gapped Document Intelligence platform.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <!-- Animated background -->
    <div class="bg-gradient-layer"></div>
    <div class="bg-grid-layer"></div>

    <div class="login-page">
        <div class="login-card">
            <div class="login-brand">
                <div class="brand-shield">🛡️</div>
                <h1>AI Document Assistant</h1>
                <p class="brand-subtitle">Secure Local Intelligence Platform</p>
            </div>

            <form id="loginForm" autocomplete="on">
                <div class="form-group" id="usernameGroup">
                    <label for="loginUsername">Username</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18">
                            <path fill="currentColor"
                                d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                        </svg>
                        <input type="text" id="loginUsername" name="username" placeholder="Enter your username"
                            autocomplete="username" required>
                    </div>
                </div>

                <div class="form-group" id="passwordGroup">
                    <label for="loginPassword">Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18">
                            <path fill="currentColor"
                                d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" />
                        </svg>
                        <input type="password" id="loginPassword" name="password" placeholder="Enter your password"
                            autocomplete="current-password" required>
                        <button type="button" class="toggle-password" id="togglePassword" tabindex="-1"
                            aria-label="Toggle password visibility">
                            <svg viewBox="0 0 24 24" width="18" height="18" class="eye-open">
                                <path fill="currentColor"
                                    d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" />
                            </svg>
                            <svg viewBox="0 0 24 24" width="18" height="18" class="eye-closed" style="display:none;">
                                <path fill="currentColor"
                                    d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe" checked>
                        <span class="checkmark"></span>
                        <span>Remember me</span>
                    </label>
                </div>

                <div class="error-banner" id="loginError" style="display: none;">
                    <svg viewBox="0 0 24 24" width="16" height="16">
                        <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                    <span id="loginErrorText">Invalid credentials</span>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="btn-text">Sign In</span>
                    <div class="btn-spinner" style="display: none;">
                        <span></span><span></span><span></span>
                    </div>
                </button>
            </form>

            <div class="login-footer">
                <div class="security-badge">
                    <svg viewBox="0 0 24 24" width="14" height="14">
                        <path fill="currentColor"
                            d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" />
                    </svg>
                    <span>Air-gapped · Local inference · No data leaves your network</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const usernameInput = document.getElementById('loginUsername');
            const passwordInput = document.getElementById('loginPassword');
            const rememberMe = document.getElementById('rememberMe');
            const loginBtn = document.getElementById('loginBtn');
            const errorBanner = document.getElementById('loginError');
            const errorText = document.getElementById('loginErrorText');
            const togglePassword = document.getElementById('togglePassword');
            const eyeOpen = togglePassword.querySelector('.eye-open');
            const eyeClosed = togglePassword.querySelector('.eye-closed');

            // Check if already logged in
            const existingToken = localStorage.getItem('rag_token') || sessionStorage.getItem('rag_token');
            if (existingToken) {
                // Verify token is still valid
                fetch('/api/auth/me', {
                    headers: { 'Authorization': `Bearer ${existingToken}` }
                }).then(res => {
                    if (res.ok) window.location.href = '/index.html';
                }).catch(() => { });
            }

            // Toggle password visibility
            togglePassword.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                eyeOpen.style.display = isPassword ? 'none' : 'block';
                eyeClosed.style.display = isPassword ? 'block' : 'none';
            });

            // Login form submit
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = usernameInput.value.trim();
                const password = passwordInput.value;

                if (!username || !password) return;

                // Show loading state
                loginBtn.querySelector('.btn-text').style.display = 'none';
                loginBtn.querySelector('.btn-spinner').style.display = 'flex';
                loginBtn.disabled = true;
                errorBanner.style.display = 'none';
                form.classList.remove('shake');

                try {
                    const res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password }),
                    });

                    if (!res.ok) {
                        const err = await res.json().catch(() => ({}));
                        throw new Error(err.detail || 'Login failed');
                    }

                    const data = await res.json();
                    const storage = rememberMe.checked ? localStorage : sessionStorage;
                    storage.setItem('rag_token', data.token);
                    storage.setItem('rag_user', JSON.stringify(data.user));

                    // Success animation before redirect
                    loginBtn.classList.add('success');
                    loginBtn.querySelector('.btn-text').textContent = '✓ Success';
                    loginBtn.querySelector('.btn-text').style.display = 'block';
                    loginBtn.querySelector('.btn-spinner').style.display = 'none';

                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 500);

                } catch (err) {
                    errorText.textContent = err.message;
                    errorBanner.style.display = 'flex';
                    form.classList.add('shake');
                    setTimeout(() => form.classList.remove('shake'), 600);

                    loginBtn.querySelector('.btn-text').style.display = 'block';
                    loginBtn.querySelector('.btn-spinner').style.display = 'none';
                    loginBtn.disabled = false;
                    passwordInput.focus();
                    passwordInput.select();
                }
            });

            // Focus username on load
            usernameInput.focus();
        });
    </script>
</body>

</html>
